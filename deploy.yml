# .github/workflows/deploy.yml
# Bakes your secrets into index.html at build time, then publishes to GitHub Pages.
#
# The Gemini key is NOT a GitHub secret — it lives in the Apps Script proxy
# (Script Properties). The browser only gets the proxy URL below.
#
# Add these repository secrets first (Settings ▸ Secrets and variables ▸ Actions):
#   APPS_SCRIPT_URL  your Apps Script /exec URL (does Gemini proxy + sheet log)
#   FIREBASE_CONFIG  SINGLE-LINE JSON, e.g.
#                    {"apiKey":"…","databaseURL":"https://…-default-rtdb.firebasedatabase.app","projectId":"…"}
#   GEMINI_MODEL     optional, e.g. gemini-2.5-flash (omit to keep the in-file default)
#
# Note: the proxy URL is visible in the deployed page, so someone who finds it
# could use your Gemini quota — but they can never read the key. If abused,
# re-deploy the Apps Script (new URL) or restrict it. Keeping the repo/site
# private is still recommended.

name: Deploy English Writing Feedback to Pages

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # Plain-string replaceAll (no regex) — safe even if secrets contain / " { } etc.
      - name: Bake secrets into index.html
        env:
          GEMINI_MODEL: ${{ secrets.GEMINI_MODEL }}
          FIREBASE_CONFIG: ${{ secrets.FIREBASE_CONFIG }}
          APPS_SCRIPT_URL: ${{ secrets.APPS_SCRIPT_URL }}
        run: |
          mkdir -p dist
          node -e '
            const fs = require("fs");
            let html = fs.readFileSync("index.html", "utf8");
            const sub = (token, val) => { if (val) html = html.split(token).join(val); };
            sub("__GEMINI_MODEL__",    process.env.GEMINI_MODEL);
            sub("__FIREBASE_CONFIG__", process.env.FIREBASE_CONFIG);
            sub("__APPS_SCRIPT_URL__", process.env.APPS_SCRIPT_URL);
            fs.writeFileSync("dist/index.html", html);
          '

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deploy
        uses: actions/deploy-pages@v4
